<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tool.title }} - SpokeStack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-indigo-400">{{ tool.title }}</h1>
        <p class="text-slate-400 text-sm mb-6">{{ tool.description }}</p>

        <form action="/api/pay/{{ slug }}" method="POST" enctype="multipart/form-data" class="space-y-4">
            
            <!-- RAW DATA TEXTAREA BOX -->
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Paste your raw data here:</label>
                <textarea 
                    name="raw_data" 
                    rows="5" 
                    placeholder="Paste text, numbers, raw payloads, or CSV strings here..."
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                ></textarea>
            </div>

            <!-- OR UPLOAD FILE -->
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Or upload a file (PDF / CSV / TXT):</label>
                <input 
                    type="file" 
                    name="uploaded_file" 
                    class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600"
                />
            </div>

            <hr class="border-slate-700 my-4" />

            <!-- PAYMENT INPUTS -->
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">M-Pesa Phone Number:</label>
                <input 
                    type="tel" 
                    name="phone_number" 
                    placeholder="0712345678" 
                    required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                />
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Email Address:</label>
                <input 
                    type="email" 
                    name="email" 
                    placeholder="yourname@gmail.com" 
                    required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                />
            </div>

            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200"
            >
                Pay KES {{ tool.price_kes }} & Convert
            </button>
        </form>
    </div>

</body>
</html>
