<script>
document.getElementById('toolForm').addEventListener('submit', async (e) => {
    e.preventDefault(); // Prevents browser from navigating to the white raw JSON page
    
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');
    
    submitBtn.innerText = "Processing Payment...";
    submitBtn.disabled = true;
    
    const formData = new FormData(e.target);
    const slug = "{{ slug }}";

    try {
        const response = await fetch(`/api/pay/${slug}`, {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        statusBox.style.display = 'block';
        if (data.status === 'success') {
            statusBox.className = 'p-4 rounded-lg bg-green-100 text-green-800 border border-green-300';
            statusBox.innerHTML = `<strong>Success!</strong> ${data.message} <br><small>Ref: ${data.reference}</small>`;
        } else {
            statusBox.className = 'p-4 rounded-lg bg-red-100 text-red-800 border border-red-300';
            statusBox.innerHTML = `<strong>Error:</strong> ${data.message}`;
        }
    } catch (err) {
        statusBox.style.display = 'block';
        statusBox.className = 'p-4 rounded-lg bg-red-100 text-red-800 border border-red-300';
        statusBox.innerHTML = '<strong>Error:</strong> Failed to connect to server. Check network connection.';
    } finally {
        submitBtn.innerText = "Pay & Convert";
        submitBtn.disabled = false;
    }
});
</script>
