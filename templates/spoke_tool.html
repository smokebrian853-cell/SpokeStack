<script>
document.addEventListener('DOMContentLoaded', () => {
    const toolForm = document.getElementById('toolForm');
    if (!toolForm) return;

    toolForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // STOPS browser from going to the white JSON page
        
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');
        const slug = "{{ slug }}";
        
        // UI Loading state
        submitBtn.innerText = "Sending STK Push...";
        submitBtn.disabled = true;
        statusBox.className = "mb-4 p-4 rounded-lg text-sm font-medium bg-blue-100 text-blue-800 border border-blue-300 block";
        statusBox.innerHTML = "⌛ Initializing M-Pesa transaction... Check your phone screen!";

        const formData = new FormData(toolForm);

        try {
            const response = await fetch(`/api/pay/${slug}`, {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (response.ok && data.status === 'success') {
                statusBox.className = "mb-4 p-4 rounded-lg text-sm font-medium bg-green-100 text-green-800 border border-green-300 block";
                statusBox.innerHTML = `<strong>✅ STK Push Sent!</strong><br>${data.message}<br><span class="text-xs text-gray-600">Ref: ${data.reference}</span>`;
            } else {
                statusBox.className = "mb-4 p-4 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-300 block";
                statusBox.innerHTML = `<strong>⚠️ Payment Error:</strong> ${data.message || 'Check phone number and try again.'}`;
            }
        } catch (err) {
            statusBox.className = "mb-4 p-4 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-300 block";
            statusBox.innerHTML = "<strong>⚠️ Server Error:</strong> Could not reach SpokeStack engine.";
        } finally {
            submitBtn.innerText = "Pay & Convert";
            submitBtn.disabled = false;
        }
    });
});
</script>
